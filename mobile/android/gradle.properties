android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler computes a relative path between the pub
# cache (C:) and this project (D:) — different drive roots make that
# computation throw (IllegalArgumentException: this and base files have
# different roots), which crashed the shared_preferences_android build.
# Disabling incremental compilation avoids the broken code path entirely;
# it costs a slightly slower rebuild, nothing else.
kotlin.incremental=false
